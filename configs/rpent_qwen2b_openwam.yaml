planner:
  backend: local_qwen_transformers
  model_path: /root/gpufree-data/models/Qwen/Qwen3.5-2B
  reasoning: true
  context_length: 8192
  max_generation_tokens: 6144
  context_margin: 32
  timeout: 180
  dtype: bfloat16
  temperature: 0.0
rpent:
  max_turns: 8
  history_policy: upstream_prune_history_images
actor:
  checkpoint: /root/gpufree-data/models/OpenWAM/OpenWAM-Alpha-Sim-RoboDojo
  replan_steps: 32
  predicted_chunk_length: 32
  timeout: 300
tool:
  high_level_window: 64
environment:
  task: fill_pen_holder
  seed: 0
  max_steps: 512
  env_cfg_type: arx_x5
  control_frequency: 25
logging:
  enabled: true
  gpu_sample_seconds: 1
  video_fps: 25
runtime:
  startup_timeout: 900
  robot_tool_timeout: 600
  shutdown_timeout: 120
paths:
  robodojo: /root/gpufree-data/RoboDojo
  runtime_python: /root/gpufree-data/conda-envs/robodojo-runtime/bin/python
  actor_python: /root/gpufree-data/conda-envs/openwam/bin/python
  planner_python: /root/gpufree-data/conda-envs/rpent-qwen/bin/python
